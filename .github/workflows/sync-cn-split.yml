name: Sync CN Split Tunnels to Cloudflare Zero Trust

permissions:
  contents: read

on:
  schedule:
    # GitHub Actions cron is always UTC.
    # '0 19 * * 6' = UTC Saturday 19:00 = Beijing time (UTC+8) Sunday 03:00
    - cron: '0 19 * * 6'
  workflow_dispatch:

concurrency:
  group: cf-zt-cn-split
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dry run
        env:
          DRY_RUN: '1'
          MAX_RULES: ${{ vars.MAX_RULES || '1400' }}
        run: python cf-zt-cn-split.py
      - name: Write Cloudflare exclude list
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          MODE: exclude
          MAX_RULES: ${{ vars.MAX_RULES || '1400' }}
          ALL_PROFILES: '1'
          EXTRAS: '1'
          PRESERVE: '1'
          DRY_RUN: '0'
        run: python cf-zt-cn-split.py
